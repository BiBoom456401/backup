<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/DangKi.css" />
    <script
      src="https://kit.fontawesome.com/4f2b166bb1.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Create account</title>
  </head>

  <body>
    <div class="form__create">
      <form id="action">
        <div class="form__name">
          <h2>Tạo Tài Khoản</h2>
        </div>
        <div class="input">
          <label for="first-name">Tên đăng nhập</label>
          <input type="text" id="first-name" class="input__type" />
        </div>
        <div class="input">
          <label for="email">Email</label>
          <input type="text" id="email" class="input__type" />
        </div>
        <div class="input">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" class="input__type" />
        </div>
        <div class="input">
          <label for="confirm-password">Nhập lại mật khẩu</label>
          <input type="password" id="confirm-password" class="input__type" />
        </div>
        <div class="check">
          <input type="checkbox" id="check-box" />
          <label style="color: white" for="check-box">Xác nhận thông tin</label>
        </div>
        <div class="button">
          <button type="submit">Đăng Ký</button>
        </div>
        <div class="box">
          <p>or</p>
        </div>
        <div class="icon">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
      </form>
    </div>
    <script src="../JS/main.js"></script>
  </body>
</html>
