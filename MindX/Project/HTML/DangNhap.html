<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/DangKi.css" />
    <script
      src="https://kit.fontawesome.com/4f2b166bb1.js"
      crossorigin="anonymous"
    ></script>

    <title>Create account</title>
  </head>

  <body>
    <div class="form__create">
      <form id="action">
        <div class="form__name">
          <h2>Đăng nhập</h2>
        </div>
        <div class="input">
          <label for="emailLogin">Tên đăng nhập</label>
          <input type="text" id="emailLogin" class="input__type" />
        </div>
        <div class="input">
          <label for="passwordLogin">Mật khẩu</label>
          <input type="password" id="passwordLogin" class="input__type" />
        </div>
        <div class="check">
          <label style="color: white">
            <input type="checkbox" /> Lưu đăng nhập</label
          >
          <a
            style="text-decoration: none; color: white; padding-left: 110px"
            href="#"
          >
            Quên mật khẩu ?
          </a>
        </div>
        <div class="button">
          <button id="button" type="submit" onclick="kiemTraDangNhap()">
            Đăng nhập
          </button>
        </div>

        <div class="box">
          <p>or</p>
        </div>
        <div class="icon">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
      </form>
    </div>
    <script src="../JS/main.js"></script>
    <script src="../JS/dangnhap.js"></script>
  </body>
</html>
